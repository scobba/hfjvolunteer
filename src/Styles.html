<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /*
   * Healthcare for Justice palette, sampled from healthcareforjustice.org:
   * navy #333367 (headline, logo), sage #809E8B ("For Justice", curves),
   * light green #86BE95 (menu links), sky #ADC4DE (hero), slate #465663.
   * Sage and light green are too light for small text on white (2.9:1 and
   * 2.1:1), so they're used for accents only; text uses --sage-ink (5.6:1).
   */
  :root {
    --navy: #333367; --navy-dark: #26264f; --sage: #809e8b; --sage-ink: #4f6f5c; --green: #86be95;
    --sky: #adc4de; --sky-soft: #e6eef7; --slate: #465663;
    --bg: #f5f8fb; --card: #fff; --ink: #24263a; --muted: #5c6670; --line: #e1e6ec;
    --brand: var(--navy);
    --ok: #2e5a43; --ok-bg: #e6efe8; --warn: #8a5a00; --warn-bg: #fcf1d8;
    --bad: #b42318; --bad-bg: #fdecea; --info-bg: var(--sky-soft);
    --heading: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  a { color: var(--navy); text-underline-offset: 2px; }
  a:hover { color: var(--sage-ink); }

  /* Header: white like the site, slate stripe on top, navy + sage rule echoing the site's curves. */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 10px 24px 9px;
    background: #fff; border-top: 4px solid var(--slate);
    box-shadow: 0 3px 0 var(--navy), 0 6px 0 var(--sage); margin-bottom: 6px; }
  .top .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--navy); }
  .top .brand img { height: 46px; width: auto; display: block; }
  .top .brand span { font-family: var(--heading); font-weight: 600; font-size: 15px; color: var(--sage-ink);
    border-left: 2px solid var(--line); padding-left: 12px; }
  .top nav { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-left: auto; }
  .top nav a { font-family: var(--heading); font-weight: 500; font-size: 15px; color: var(--muted);
    text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  .top nav a:hover { color: var(--sage-ink); }
  .top nav a.active { color: var(--navy); border-bottom-color: var(--green); }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  h1, h2, h3 { font-family: var(--heading); color: var(--navy); }
  h1 { font-size: 24px; font-weight: 600; margin: 4px 0 12px; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  h3 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    margin-bottom: 14px; box-shadow: 0 1px 2px rgba(51, 51, 103, .05); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .grid .card { margin: 0; border-top: 3px solid var(--sky); }
  .count { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 11px; background: var(--sky-soft);
    color: var(--navy); font-size: 13px; text-align: center; margin-left: 6px; font-family: var(--heading); }
  .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; background: var(--warn-bg); color: var(--warn);
    border-left: 4px solid #d9a441; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list > li { padding: 9px 0; border-top: 1px solid var(--line); }
  ul.list > li:first-child { border-top: 0; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600;
    background: var(--line); color: var(--ink); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.info { background: var(--info-bg); color: var(--navy); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--heading); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--sage-ink); border-top: 0; }
  .table-wrap { overflow-x: auto; }
  form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 14px; }
  label { display: block; font-size: 13px; color: var(--muted); }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 3px; }
  label.check { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-size: 14px; }
  label.check > input { display: inline-block; width: auto; flex: 0 0 auto; margin: 3px 0 0; accent-color: var(--navy); }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid #c8d0da; border-radius: 6px;
    background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--sky); outline-offset: 0; border-color: var(--navy); }
  textarea { min-height: 64px; }
  button, .btn { font-family: var(--heading); font-weight: 600; font-size: 14px; padding: 8px 18px; border-radius: 6px;
    border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--navy-dark); border-color: var(--navy-dark); color: #fff; }
  button.secondary, .btn.secondary { background: #fff; color: var(--navy); }
  button.secondary:hover { background: var(--sky-soft); color: var(--navy); }
  button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .side-by-side > div { border: 1px dashed var(--line); border-radius: 6px; padding: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .filters input { min-width: 200px; }
  .reasons { margin: 4px 0 0; padding-left: 18px; color: var(--bad); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy);
    color: #fff; padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 10; }
  .toast.error { background: var(--bad); }
  .error-card { border-color: var(--bad); }
  .req-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 10px;
    align-items: end; }
  .small-btn { padding: 4px 12px; font-size: 13px; }
  details summary { color: var(--navy); cursor: pointer; }
  .docpreview { border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; margin-top: 6px; max-height: 360px; overflow-y: auto; }
  .docpreview h1 { font-size: 17px; } .docpreview h2 { font-size: 14px; }
  /* Call calendar month grid (CallGrid.html). */
  .cg-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cg-nav h2 { margin: 0; min-width: 150px; text-align: center; }
  .callgrid { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cg-head, .cg-body { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cg-head div { font-family: var(--heading); font-size: 12px; font-weight: 600; color: var(--sage-ink); text-align: center;
    padding: 6px 0; background: var(--sky-soft); }
  .cg-cell { min-height: 74px; padding: 4px 6px; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    font-size: 12px; overflow: hidden; background: #fff; }
  .cg-cell:nth-child(7n+1) { border-left: 0; }
  .cg-num { font-weight: 600; color: var(--muted); }
  .cg-pad, .cg-cell.past, .cg-cell.later { background: #f7f8fa; color: var(--muted); }
  .cg-cell.open { background: #fff8e6; cursor: pointer; }
  .cg-cell.open:hover, .cg-cell.pick:hover { outline: 2px solid var(--navy); outline-offset: -2px; }
  .cg-cell.open .cg-num { color: var(--warn); }
  .cg-cell.mine { background: var(--ok-bg); cursor: pointer; }
  .cg-cell.mine .cg-num, .cg-cell.mine .cg-tag { color: var(--ok); font-weight: 600; }
  .cg-cell.taken { background: var(--sky-soft); }
  .cg-cell.pick { cursor: pointer; }
  .cg-cell.sel { outline: 2px solid var(--navy); outline-offset: -2px; }
  .cg-tag { display: block; margin-top: 2px; line-height: 1.25; word-break: break-word; }
  .cg-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .cg-legend span::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--sw); }
  @media (max-width: 600px) {
    .cg-cell { min-height: 52px; padding: 3px; font-size: 10px; }
    .top { padding: 8px 16px 7px; }
    .top .brand img { height: 38px; }
    .top nav { margin-left: 0; gap: 2px 16px; }
    .side-by-side { grid-template-columns: 1fr; }
    th.hide-sm, td.hide-sm { display: none; }
  }
</style>
