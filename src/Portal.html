<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
  <?!= include('SignPad'); ?>
  <style>
    .portal { max-width: 760px; }
    .task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
    .task:first-child { border-top: 0; }
    .task .dot { flex: 0 0 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; background: var(--line); color: var(--muted); }
    .task.done .dot { background: var(--ok-bg); color: var(--ok); }
    .task.waiting .dot, .task.hfj .dot { background: var(--info-bg); color: var(--brand); }
    .task .body { flex: 1; min-width: 0; }
    .task .title { font-weight: 600; }
    .docbox { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; max-height: 420px; overflow-y: auto;
      background: #fcfcfd; margin: 8px 0 12px; }
    .docbox h1 { font-size: 18px; } .docbox h2 { font-size: 15px; margin-top: 14px; }
    .docbox .filled { font-weight: 600; } .docbox .blank { display: inline-block; min-width: 120px; border-bottom: 1px solid #999; }
    .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0 14px; }
    .progress > div { height: 100%; background: var(--ok); }
    .small-btn { padding: 3px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="top"><span class="brand" style="color:#fff">Healthcare for Justice · Volunteers</span></header>
  <main id="app" class="portal"><p class="muted">Loading…</p></main>
  <div id="toast" class="toast" hidden></div>
  <script>
    var PORTAL_MODE = <?= mode ?>;
    var PORTAL_TOKEN = <?= token ?>;
  </script>
  <?!= include('PortalApp'); ?>
</body>
</html>
