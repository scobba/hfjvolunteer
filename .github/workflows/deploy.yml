# Merging to main deploys: tests, then `clasp push` to the bound Apps Script
# project, then both web app deployments move to the new version (same URLs):
#   DEPLOYMENT_ID            admin dashboard, "Anyone within hfjvc.org"
#   VOLUNTEER_DEPLOYMENT_ID  volunteer portal, "Anyone, even anonymous", so
#                            volunteers with personal email can open their link
# Access is part of the manifest of each version, so the job pushes twice:
# once with domain-only access for the admin deployment, once with anonymous
# access for the portal. Credentials belong to the dedicated deploy account,
# which can edit only this project. Setup: README → "Automatic deploys".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly until the repository variable SCRIPT_ID is set.
    if: ${{ vars.SCRIPT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials and project file
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::The CLASPRC_JSON secret is missing. See README → Automatic deploys."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: Write deployment URLs into the app
        env:
          ADMIN_ID: ${{ vars.DEPLOYMENT_ID }}
          VOLUNTEER_ID: ${{ vars.VOLUNTEER_DEPLOYMENT_ID }}
        run: node scripts/write-generated.mjs

      - name: Push and update the admin dashboard
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          clasp push --force
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Code pushed. DEPLOYMENT_ID isn't set yet, so the dashboard wasn't updated."
            exit 0
          fi
          clasp redeploy "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7} admin $(git log -1 --format=%s | cut -c1-70)"

      - name: Push and update the volunteer portal
        env:
          VOLUNTEER_DEPLOYMENT_ID: ${{ vars.VOLUNTEER_DEPLOYMENT_ID }}
        run: |
          node scripts/portal-manifest.mjs
          clasp push --force
          desc="${GITHUB_SHA::7} portal $(git log -1 --format=%s | cut -c1-70)"
          if [ -n "$VOLUNTEER_DEPLOYMENT_ID" ]; then
            clasp redeploy "$VOLUNTEER_DEPLOYMENT_ID" --description "$desc"
          else
            out=$(clasp create-deployment --description "$desc" 2>&1) || true
            echo "$out"
            id=$(echo "$out" | grep -o 'AKfy[A-Za-z0-9_-]*' | head -1)
            if [ -z "$id" ]; then
              echo "::error::Couldn't create the volunteer portal deployment (see above). If it says ANYONE access is disabled, see README → Automatic deploys."
              exit 1
            fi
            echo "::notice::Created the volunteer portal deployment. Add the repository variable VOLUNTEER_DEPLOYMENT_ID = $id, then re-run this job."
          fi

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
